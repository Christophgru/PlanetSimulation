<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 395" width="1000" height="395">
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#647889"/></marker></defs>
<rect width="1000" height="395" fill="#ffffff"/>
<text x="26.00" y="35.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#17334b" font-weight="700">Great-circle camera transport across a pole</text>
<line x1="26.00" y1="51.00" x2="974.00" y2="51.00" stroke="#e2ebee" stroke-width="2" stroke-linecap="round"/>
<circle cx="292.00" cy="226.00" r="125.00" fill="#f2f6f8" stroke="#177f89" stroke-width="2"/>
<circle cx="292.00" cy="101.00" r="7.00" fill="#cb6269"/>
<text x="309.00" y="105.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#cb6269" font-weight="700">north pole</text>
<path d="M 195 151 Q 247 87 292 101 Q 337 116 382 158" stroke="#df982c" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<circle cx="211.00" cy="138.00" r="6.00" fill="#17334b"/>
<line x1="211.00" y1="138.00" x2="241.00" y2="117.00" stroke="#177f89" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<circle cx="350.00" cy="138.00" r="6.00" fill="#17334b"/>
<line x1="350.00" y1="138.00" x2="381.00" y2="160.00" stroke="#177f89" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
<text x="161.00" y="141.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#177f89">old tangent</text>
<text x="386.00" y="141.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#177f89">transported tangent</text>
<rect x="520.00" y="96.00" width="430.00" height="229.00" rx="10" fill="#f2f7f8" stroke="#e2ebee" stroke-width="2"/>
<text x="546.00" y="133.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#17334b" font-weight="700">transport the camera basis</text>
<text x="546.00" y="173.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#177f89">axis = normalize(radial × tangent)</text>
<text x="546.00" y="207.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#177f89">angle = walk distance / radius</text>
<text x="546.00" y="241.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#177f89">view′ = rotation(axis, angle) · view</text>
<text x="546.00" y="290.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#647889">avoids the longitude-frame flip at the pole</text>
