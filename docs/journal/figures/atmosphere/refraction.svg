<text x="663.00" y="307.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#647889">24 if refraction is disabled</text>
<text x="663.00" y="345.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="13" fill="#647889">distant image is reprojected</text>
