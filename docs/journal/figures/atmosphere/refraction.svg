<text x="663.00" y="128.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#17334b" font-weight="700">radial model</text>
<text x="663.00" y="165.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="16" fill="#177f89">ρ(h) ≈ exp(−h / H)</text>
<text x="663.00" y="201.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#177f89">n(h) − 1 ∝ (P / T) · ρ(h)</text>
<text x="663.00" y="237.00" text-anchor="start" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#177f89">d direction / ds = ∇n⊥ / n</text>
